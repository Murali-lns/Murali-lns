name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#161b22,#3b0a75,#5a14b0,#7f00ff,#00d4ff

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dist/ is root-owned (created by the Docker action), so publish from a fresh dir.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" output >/dev/null 2>&1; then
            git clone -q --depth 1 --branch output "$remote" publish
          else
            mkdir publish && git -C publish init -q -b output && git -C publish remote add origin "$remote"
          fi
          cp dist/snake.svg dist/snake-dark.svg publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Update contribution snake"
          git push -q origin output
